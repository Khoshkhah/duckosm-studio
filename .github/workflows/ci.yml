# CI for duckOSM Studio (github.com/Khoshkhah/duckosm-studio): the browser page. The engine (duckosm-core, -parquet,
# -duckdb, -build, the CLI and the Python module) lives in the duckOSM repository (rust/), with its own tests,
# wheels and release (duckOSM .github/workflows/). This repository takes duckosm-core and duckosm-build from
# there with a Git dependency (crates/duckosm-wasm/Cargo.toml).
name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: the WebAssembly build and its tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: The WebAssembly module builds, and its byte functions give the files of the path functions
        run: |
          cargo build --release -p duckosm-wasm --target wasm32-unknown-unknown
          cargo test --release -p duckosm-wasm
      - name: Nightly Rust for the WebAssembly module with threads
        run: rustup toolchain install nightly-2026-10-15 --profile minimal --component rust-src --target wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: Both WebAssembly modules of the page build (one thread, and threads)
        run: ./crates/duckosm-wasm/build.sh
      # The Pages deploy puts a version on every file reference of the page (version_refs.py) and stops when one is left
      # without: check it here on a copy, so that a new file name in roadstyle's files stops the pull request, not the deploy
      - name: Each file reference of the page gets a version
        run: |
          cp -r crates/duckosm-wasm/www "$RUNNER_TEMP/www"
          python3 crates/duckosm-wasm/www/version_refs.py "$RUNNER_TEMP/www" check
      # The test of duckosm-wasm wrote the native files and fixes.yaml to target/tmp/<checkout folder> (one folder for
      # each checkout, because worktrees can share target/). The metadata and the levels metadata hold the build time
      # and the time zone, so they are not compared.
      - name: The WebAssembly module in Node writes the files of the native build (Monaco)
        run: |
          t=target/tmp/$(basename "$PWD")
          node crates/duckosm-wasm/www/run_node.mjs tests/data/monaco.osm.pbf out-node driving,walking,cycling $t/fixes.yaml
          test $(ls out-node | wc -l) = $(ls $t/duckosm-wasm-native | wc -l)
          for f in out-node/*; do
            case ${f##*/} in visualization_metadata_main.parquet|edge_levels_meta_visualization.parquet) continue;; esac
            cmp $f $t/duckosm-wasm-native/${f##*/}
          done
      # The page uses roadstyle's parts for every control (parts_e2e.py): Monaco is built in the page, and each control of the panel, of the
      # export list and of card 7 must change its look under the pointer, in the light and the dark theme
      - name: Every control of the page has roadstyle's hover (Playwright, Monaco)
        run: |
          pip install playwright==1.60.0
          python3 -m playwright install --with-deps chromium
          cd crates/duckosm-wasm/www && python3 parts_e2e.py "$RUNNER_TEMP/out-parts"
      # The table views of duckOSM in the data dock, with the real DuckDB-wasm of the page (kinds_e2e.py): a turn, a node, an H3 cell, lane_profile, and the Reset of Ask
      - name: Every table is on the map with a card (Playwright, Monaco)
        run: cd crates/duckosm-wasm/www && python3 kinds_e2e.py "$RUNNER_TEMP/out-kinds"
      # The download of a region file through the relay (download_e2e.py, no network): a slow request goes again, a part that is done
      # takes half of another, and the stored file equals the relay's bytes
      - name: The download of a region file is complete and helps a slow part (Playwright)
        run: cd crates/duckosm-wasm/www && python3 download_e2e.py
      # Delete all of Studio's files in the browser (storage_e2e.py, Monaco): Studio's entries go; other pages' entries of the same site, the
      # folder of this tab and the open area stay
      - name: Delete all removes only Studio's files (Playwright, Monaco)
        run: cd crates/duckosm-wasm/www && python3 storage_e2e.py "$RUNNER_TEMP/out-storage"
      # The page on a phone (iPhone 13 and 390 px): the sheet, Build in view when it is ready, the fixes editor and the design panel in the
      # sheet. A page change needs this check before a merge.
      - name: The page on a phone (Playwright, Monaco)
        run: |
          cd crates/duckosm-wasm/www
          python3 phone_e2e.py "$RUNNER_TEMP/out-phone"
          python3 phone_fixes_e2e.py
          python3 phone_design_e2e.py
      # The buttons and the steps: a disabled look with its reason, the progress in one place, Build in card 4; the limit of roads on the
      # map. ponytail: boundary_e2e --no-search passes on a Mac and failed here once (Delete shape after Merge, 2026-11-13): add it again
      # when that is found
      - name: The buttons and the limit of roads (Playwright, Monaco)
        run: |
          cd crates/duckosm-wasm/www
          python3 buttons_e2e.py "$RUNNER_TEMP/out-buttons"
          python3 roads_limit_e2e.py
      # A saved area opens again with its tables, its map and its cut file; a new look (theme) keeps the tiles
      - name: Saved areas and a new look on the same tiles (Playwright, Monaco)
        run: |
          cd crates/duckosm-wasm/www
          python3 saved_e2e.py "$RUNNER_TEMP/out-saved"
          python3 restyle_e2e.py
      # The ground: a DEM file in the Ground step, the terrain from the area's own ground (no AWS), the files of the export
      - name: The ground and the export (Playwright, Monaco)
        run: |
          pip install pillow
          cd crates/duckosm-wasm/www
          python3 dem_e2e.py "$RUNNER_TEMP/out-dem"
          python3 ground_e2e.py "$RUNNER_TEMP/out-ground"
          python3 export_e2e.py "$RUNNER_TEMP/out-export"
