<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">duckOSM Studio</title>
  <desc id="d">Build the road network of any area from OpenStreetMap in your browser. Built with duckOSM and roadstyle. Dark version.</desc>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#151a21" stop-opacity="1"/>
      <stop offset="0.56" stop-color="#151a21" stop-opacity="1"/>
      <stop offset="0.78" stop-color="#151a21" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- the map: the ground, the sea, the buildings and the roads in the light look of the page (casing, then fill) -->
  <rect width="1280" height="640" fill="#151a21"/>
  <path d="M1280 330 C1200 360 1130 430 1090 520 C1070 570 1040 610 1000 640 L1280 640 Z" fill="#1d3a4f"/>
  <g fill="#1f262f" stroke="#2c353f" stroke-width="2">
    <rect x="700" y="60" width="64" height="44" rx="4"/><rect x="790" y="40" width="48" height="60" rx="4"/>
    <rect x="860" y="120" width="70" height="46" rx="4"/><rect x="980" y="70" width="58" height="52" rx="4"/>
    <rect x="1080" y="140" width="66" height="44" rx="4"/><rect x="1160" y="60" width="72" height="56" rx="4"/>
    <rect x="720" y="250" width="54" height="50" rx="4"/><rect x="840" y="290" width="62" height="42" rx="4"/>
    <rect x="1000" y="300" width="70" height="48" rx="4"/><rect x="1110" y="250" width="50" height="56" rx="4"/>
    <rect x="740" y="470" width="66" height="46" rx="4"/><rect x="860" y="520" width="58" height="52" rx="4"/>
    <rect x="780" y="580" width="70" height="40" rx="4"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#2f3640" stroke-width="9">
      <path d="M600 200 L1280 230"/><path d="M660 380 L1060 420"/><path d="M700 330 L1000 190"/>
      <path d="M900 -10 L930 650"/><path d="M1040 -10 L1070 430"/><path d="M760 20 L720 650"/><path d="M1180 -10 L1200 300"/>
    </g>
    <g stroke="#3b444f" stroke-width="6">
      <path d="M600 200 L1280 230"/><path d="M660 380 L1060 420"/><path d="M700 330 L1000 190"/>
      <path d="M900 -10 L930 650"/><path d="M1040 -10 L1070 430"/><path d="M760 20 L720 650"/><path d="M1180 -10 L1200 300"/>
    </g>
    <g stroke="#8a5a2b" stroke-width="20">
      <path d="M540 700 C620 540 780 500 900 400 S1140 250 1300 150"/>
    </g>
    <g stroke="#c98a3f" stroke-width="15">
      <path d="M540 700 C620 540 780 500 900 400 S1140 250 1300 150"/>
    </g>
    <g stroke="#8a5a2b" stroke-width="15">
      <path d="M560 -20 C640 120 800 200 900 400 S 960 560 1000 660"/>
    </g>
    <g stroke="#b89a3c" stroke-width="10">
      <path d="M560 -20 C640 120 800 200 900 400 S 960 560 1000 660"/>
    </g>
  </g>
  <g fill="#151a21" stroke="#8a5a2b" stroke-width="3"><circle cx="900" cy="400" r="9"/></g>
  
  <!-- a veil, so the text reads -->
  <rect width="1280" height="640" fill="url(#fade)"/>

  <!-- the text -->
  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="80" y="232" font-size="80" font-weight="700" fill="#f0f6fc" letter-spacing="-1">duckOSM <tspan fill="#3cc4d8">Studio</tspan></text>
    <text x="84" y="306" font-size="33" fill="#f0f6fc">Build the road network of any area</text>
    <text x="84" y="350" font-size="33" fill="#f0f6fc">from OpenStreetMap in your browser.</text>
    <text x="84" y="412" font-size="22" fill="#9198a1">Fix the data, style the map, export the result.</text>

    <!-- built with -->
    <text x="84" y="500" font-size="17" font-weight="600" fill="#9198a1" letter-spacing="3">BUILT WITH</text>
    <g transform="translate(84 520)">
      <g transform="scale(0.875)"><circle cx="32" cy="32" r="31" fill="#17191F" stroke="#f0f6fc" stroke-opacity="0.55" stroke-width="2"/><line x1="18" y1="44" x2="46" y2="20" stroke="#FFD43B" stroke-width="14" stroke-linecap="round"/><circle cx="18" cy="44" r="3.5" fill="#17191F"/><circle cx="46" cy="20" r="3.5" fill="#17191F"/></g>
      <text x="70" y="38" font-size="28" font-weight="600" fill="#f0f6fc">duckOSM</text>
    </g>
    <g transform="translate(340 520)">
      <g transform="scale(0.4375)">
        <clipPath id="c"><rect x="4" y="4" width="120" height="120" rx="28"/></clipPath>
        <rect x="4" y="4" width="120" height="120" rx="28" fill="#FF6B35"/>
        <path clip-path="url(#c)" d="M34 136 C34 84 94 90 94 58 C94 30 60 22 60 -8" fill="none" stroke="#FFFFFF" stroke-width="15"/>
      </g>
      <text x="70" y="38" font-size="28" font-weight="600" fill="#f0f6fc">roadstyle</text>
    </g>
  </g>
</svg>
